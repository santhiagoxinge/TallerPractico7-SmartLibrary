spring.application.name=smartlibrary-api

# Base de datos H2 en memoria (se reinicia en cada ejecucion)
spring.datasource.url=jdbc:h2:mem:smartlibrary
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Carga data.sql despues de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:smartlibrary)
spring.h2.console.enabled=true
